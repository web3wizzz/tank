name: Local container CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tank
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            tank/sdk-ts/package-lock.json
            tank/frontend/package-lock.json
      - name: Install acceptance dependencies
        run: |
          npm --prefix sdk-ts ci
          npm --prefix sdk-ts run build
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
      - name: Build and verify disposable local containers
        run: bash scripts/test-containers.sh
