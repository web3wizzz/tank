name: Contract CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tank/contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
          cache: false
      - name: Check formatting
        run: forge fmt --check
      - name: Build registry
        run: forge build
      - name: Test registry and fuzz invariants
        # Deployment fixtures mutate process-wide environment via vm.setEnv.
        run: forge test --threads 1

  arc-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tank
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: tank/go.mod
          cache-dependency-path: tank/go.sum
      - name: Install checksum-pinned Arc Foundry
        run: bash scripts/install-arc-foundry.sh "$RUNNER_TEMP/tank-arc-foundry"
      - name: Arc contracts, native gas, signed registration and restart recovery
        env:
          TANK_ARC_FORGE_BIN: ${{ runner.temp }}/tank-arc-foundry/arc-forge
          TANK_ARC_ANVIL_BIN: ${{ runner.temp }}/tank-arc-foundry/arc-anvil
        run: bash scripts/test-arc-local.sh
