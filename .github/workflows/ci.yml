name: Tank CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tank

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tank/go.mod
          cache-dependency-path: tank/go.sum
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd internal pkg examples)"
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Verify local launcher setup
        run: |
          bash -n scripts/*.sh
          python3 scripts/test-local-env.py
          python3 scripts/test-pilot-templates.py
          python3 scripts/test-base-sepolia.py

      - name: Static checks
        run: go vet ./...

      - name: Test with race detection
        run: go test -race -count=1 -timeout=5m ./...

      - name: Build every service, CLI, and example
        run: |
          go build ./cmd/...
          go build -o bin/examples/ ./examples/...
