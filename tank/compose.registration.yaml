# Explicit opt-in local-chain overlay. Do not mount public custody or journals.
services:
  coordinator:
    environment:
      TANK_CHAIN_RPC: http://127.0.0.1:8545
      TANK_REGISTRY_ADDR: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      TANK_REGISTRANT: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
  local-chain:
    image: tank-local-chain
    build: {context: ., dockerfile: deploy/container/Dockerfile.local-chain}
    network_mode: service:coordinator
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    volumes: [local-chain:/chain]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/registry-ready && test "$$(arc-cast chain-id --rpc-url http://127.0.0.1:8545)" = 31337']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  registration-worker:
    image: tank-local-go
    build: {context: ., dockerfile: deploy/container/Dockerfile.backend}
    command: [tank-registration-worker]
    network_mode: service:coordinator
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    volumes: [metadata:/data]
    depends_on:
      coordinator: {condition: service_healthy}
      local-chain: {condition: service_healthy}
    environment:
      TANK_DATABASE_PATH: /data/tank.sqlite
      TANK_CHAIN_RPC: http://127.0.0.1:8545
      TANK_REGISTRY_ADDR: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      TANK_REGISTRANT: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
    stop_grace_period: 30s
volumes:
  local-chain:
